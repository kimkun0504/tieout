[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tieout"
version = "0.1.0"
description = "Turns messy rent rolls (Excel, CSV, PDF) into clean, validated, AI-ready data, with every value traced to its source."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
server = ["tieout[pdf]", "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = [
    "tieout[server]",
    "pytest>=7",
    "hypothesis>=6.100",
    "reportlab>=4",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
tieout = "tieout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tieout"]
# The web app is built into src/tieout/web (git-ignored); ship it when present.
artifacts = ["src/tieout/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = [
    "S101",   # assert is how pytest works
    "RUF001", "RUF002", "RUF003",  # en/em dashes are intentional in docs and data
    "PTH123", # open() is fine
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/tieout"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pdfplumber.*"]
ignore_missing_imports = true
