[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tieout"
version = "0.1.0"
description = "Turns messy rent rolls (Excel, CSV, PDF) into clean, validated, AI-ready data, with every value traced to its source."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tieout = "tieout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tieout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
