[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tieout"
version = "0.1.0"
description = "Turns messy rent rolls (Excel, CSV, PDF) into clean, validated, AI-ready data, with every value traced to its source."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = [
    "tieout[server]",
    "pytest>=7",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
tieout = "tieout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tieout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
